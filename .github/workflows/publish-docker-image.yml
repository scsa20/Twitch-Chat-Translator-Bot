name: Publish Docker image

on:
  push:
    branches:
      - '**'

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Read package version
        id: package_version
        run: |
          version=$(node -e "const fs = require('fs'); const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8')); process.stdout.write(pkg.version)")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Determine image tag suffix
        id: image_tag
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "suffix=latest" >> "$GITHUB_OUTPUT"
          else
            echo "suffix=test" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker images
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/twitch-chat-translator-bot:${{ steps.image_tag.outputs.suffix }}
            ghcr.io/${{ github.repository_owner }}/twitch-chat-translator-bot:${{ steps.package_version.outputs.version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/twitch-chat-translator-bot:${{ steps.image_tag.outputs.suffix }}
            ${{ secrets.DOCKERHUB_USERNAME }}/twitch-chat-translator-bot:${{ steps.package_version.outputs.version }}